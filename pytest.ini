[pytest]
# Proje kokunu import yoluna ekle.
#
# Testler `from config import CONFIG` gibi duz import kullanir. Bu, yalnizca
# proje koku sys.path'te oldugunda calisir. `python -m pytest` calisma dizinini
# sys.path'e ekledigi icin sorunu gizler; duz `pytest` komutu EKLEMEZ ve tum
# test modulleri ModuleNotFoundError ile toplanamaz.
#
# Bu satir olmadan depoyu klonlayip `pytest` yazan herkes 10 hata alir.
# CI'da (windows-latest) bu sekilde yakalandi.
pythonpath = .

testpaths = tests

  <use href="#mark" x="128" y="426" width="32" height="32" color="#ECEDEF"/>
  <use href="#mark" x="184" y="430" width="24" height="24" color="#ECEDEF"/>
  <use href="#mark" x="232" y="434" width="16" height="16" color="#ECEDEF"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <symbol id="mark" viewBox="0 0 56 56">
      <rect x="0"  y="0"  width="39" height="14" rx="2" fill="currentColor"/>
      <rect x="42" y="0"  width="14" height="39" rx="2" fill="currentColor"/>
      <rect x="17" y="42" width="39" height="14" rx="2" fill="currentColor"/>
      <rect x="0"  y="17" width="14" height="39" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="markcore" viewBox="0 0 56 56">
      <rect x="0"  y="0"  width="39" height="14" rx="2" fill="currentColor"/>
      <rect x="42" y="0"  width="14" height="39" rx="2" fill="currentColor"/>
      <rect x="17" y="42" width="39" height="14" rx="2" fill="currentColor"/>
      <rect x="0"  y="17" width="14" height="39" rx="2" fill="currentColor"/>
      <rect x="22" y="22" width="12" height="12" rx="2" fill="currentColor"/>
    </symbol>
    <linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E08A4C"/>
      <stop offset="1" stop-color="#C0522A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0D0E11"/>

  <text x="56" y="60" fill="#ECEDEF" font-size="26" font-weight="600">Foundry Core AI — Marka Levhası</text>
  <text x="56" y="86" fill="#6B7078" font-size="14">Aperture mark · Foundry Copper paleti</text>

  <!-- ============ MARK TILES ============ -->
  <rect x="56"  y="118" width="200" height="200" rx="18" fill="#14161A" stroke="#ffffff17"/>
  <use href="#mark" x="126" y="188" width="60" height="60" color="#F2A26A"/>
  <text x="156" y="342" fill="#6B7078" font-size="12" text-anchor="middle">koyu zemin</text>

  <rect x="280" y="118" width="200" height="200" rx="18" fill="url(#brandgrad)"/>
  <use href="#mark" x="350" y="188" width="60" height="60" color="#1A0E06"/>
